# Flotteo — configuration Apache
#
# Installation :
#   sudo cp docs/apache/flotteo.conf /etc/apache2/sites-available/flotteo.conf
#   sudo a2enmod rewrite headers expires
#   sudo a2ensite flotteo
#   sudo systemctl reload apache2
#
# Modules requis :
#   - rewrite  : obligatoire, sans lui aucune route ne fonctionne ;
#   - headers  : sans lui, les en-têtes X-Content-Type-Options, X-Frame-Options
#                et Referrer-Policy déclarés dans public/.htaccess ne partent pas ;
#   - expires  : sans lui, aucune directive de cache n'est envoyée et le
#                navigateur applique une fraîcheur heuristique.
# Les blocs <IfModule> correspondants sont ignorés SILENCIEUSEMENT si le module
# manque : rien dans le journal ne signale l'absence.
#
# Le cache long des assets reste sûr même sans `expires` : Core\Url::asset()
# ajoute un jeton ?v= valant l'horodatage de modification du fichier, si bien
# qu'un asset corrigé change d'URL et est nécessairement redemandé.
#
# Le DocumentRoot pointe sur public/ : aucun fichier applicatif
# (config, core, models, views, sql) n'est directement accessible en HTTP.

<VirtualHost *:80>
    ServerName flotteo.local
    DocumentRoot /var/www/flotteo/public

    <Directory /var/www/flotteo/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Journalisation dédiée à l'application
    ErrorLog  ${APACHE_LOG_DIR}/flotteo-error.log
    CustomLog ${APACHE_LOG_DIR}/flotteo-access.log combined
</VirtualHost>
